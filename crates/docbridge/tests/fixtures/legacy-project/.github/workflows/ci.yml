name: ci
on: [push, pull_request]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check DocBridge links
        run: docbridge check
      - name: Report related files
        run: git diff --name-only origin/main...HEAD | docbridge related --stdin --gate
