[package]
name = "docbridge-release"
version = "0.17.0"
edition = "2021"
rust-version = "1.83"
publish = false
description = "Maintainer tool that signs and verifies the vNext release asset set"

[dependencies]
docbridge-update = { path = "../docbridge-update" }
ed25519-dalek = "=2.2.0"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "=3.15.0"
zeroize = "=1.8.1"
