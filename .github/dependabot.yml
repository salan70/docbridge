version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "👷 ci"
    # Setting labels replaces Dependabot's defaults, so keep them and add the
    # release label that the required Release Label check expects.
    labels:
      - dependencies
      - github_actions
      - "release: none"
