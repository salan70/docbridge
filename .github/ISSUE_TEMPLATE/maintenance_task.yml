name: Maintenance task
description: Define routine upkeep with a concrete outcome
title: "[Maintenance]: "
labels:
  - maintenance
body:
  - type: markdown
    attributes:
      value: |
        Use this form for routine upkeep that is not a bug, feature, technical design proposal, or documentation issue. Non-trivial implementation begins only after the issue receives the `status: accepted` label, regardless of who will implement it.
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I searched open and closed issues and did not find the same maintenance task.
          required: true
  - type: textarea
    id: objective-evidence
    attributes:
      label: Objective and evidence
      description: State the concrete maintenance outcome and the shortest evidence that it is needed now.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: Identify included artifacts and only the exclusions needed to prevent likely scope drift.
    validations:
      required: true
  - type: textarea
    id: acceptance-verification
    attributes:
      label: Acceptance and verification
      description: List observable completion conditions and the commands or inspections that verify them.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Add dependencies, coordination needs, or rollback concerns only when they affect execution.
