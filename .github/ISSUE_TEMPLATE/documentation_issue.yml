name: Documentation issue
description: Report incorrect, missing, or substantially restructured documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Use this form for documentation problems. Typo, wording, formatting, broken-link, or similarly small corrections do not require an issue; non-trivial documentation work begins after the issue receives the `status: accepted` label.
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I searched open and closed issues and did not find the same documentation issue.
          required: true
  - type: textarea
    id: location-audience
    attributes:
      label: Location and audience
      description: Identify the affected page or section and the reader who needs it.
      placeholder: docs/specs/cli.md#check-command; CLI integrators
    validations:
      required: true
  - type: textarea
    id: problem-evidence
    attributes:
      label: Problem and evidence
      description: Explain the reader problem and cite the implementation, behavior, or other source of truth.
    validations:
      required: true
  - type: textarea
    id: reader-outcome
    attributes:
      label: Reader outcome
      description: State what the reader should understand or be able to do after the correction.
    validations:
      required: true
  - type: textarea
    id: acceptance-counterparts
    attributes:
      label: Acceptance and counterparts
      description: List observable completion conditions and name only the mirrored or linked pages that must stay aligned.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add examples, screenshots, terminology concerns, or links only when they add new information.
