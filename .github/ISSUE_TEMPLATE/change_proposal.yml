name: Change proposal
description: Propose a feature, technical change, documentation improvement, or maintenance task
title: "[Change]: "
body:
  - type: markdown
    attributes:
      value: |
        Use the bug report form for reproducible incorrect behavior. See the [documentation guidance](https://github.com/salan70/docbridge/blob/main/docs/contributing/README.md#documentation).
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I searched open and closed issues and did not find the same proposal.
          required: true
  - type: dropdown
    id: kind
    attributes:
      label: Change kind
      options:
        - Feature
        - Technical design, API, build, or dependency
        - Documentation
        - Maintenance
    validations:
      required: true
  - type: textarea
    id: problem-evidence
    attributes:
      label: Problem and evidence
      description: State who is affected, the current limitation, and concrete evidence or affected file/section links. For documentation, identify the reader and incorrect or missing guidance.
    validations:
      required: true
  - type: textarea
    id: outcome-proposal
    attributes:
      label: Desired outcome and proposal
      description: Describe the observable result and proposed approach. Compare viable alternatives and tradeoffs when they affect the decision.
    validations:
      required: true
  - type: textarea
    id: boundaries-compatibility
    attributes:
      label: Scope and compatibility
      description: Identify affected artifacts or contracts, constraints, necessary exclusions, and any migration or operational risks.
    validations:
      required: true
  - type: textarea
    id: acceptance-verification
    attributes:
      label: Acceptance and verification
      description: List observable completion conditions and the commands or inspections that verify them. See docs/contributing/README.md#verification.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: Add links, coordination needs, or rollout details only when they affect execution.
