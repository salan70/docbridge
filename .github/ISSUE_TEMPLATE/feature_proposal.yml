name: Feature proposal
description: Propose a new capability or user-visible improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a new capability or user-visible improvement. Non-trivial implementation begins only after the issue receives the `status: accepted` label, regardless of who will implement it.
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I searched open and closed issues and did not find the same feature proposal.
          required: true
  - type: textarea
    id: problem-evidence
    attributes:
      label: Problem and evidence
      description: State the affected users, current limitation, and the shortest evidence that establishes the need.
    validations:
      required: true
  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome
      description: Describe the observable user result without choosing an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Compare only viable alternatives that could change the decision and state why they were not chosen.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: Name what must change, the compatibility risks, and only the exclusions needed to prevent likely scope drift.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make the feature complete.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add examples or links only when they affect the decision.
