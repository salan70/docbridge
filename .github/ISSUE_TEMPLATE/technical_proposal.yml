name: Technical proposal
description: Propose an API, architecture, refactor, build, CI, or dependency design change
title: "[Technical]: "
labels:
  - technical
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a technical design change. Non-trivial implementation begins only after the issue receives the `status: accepted` label, regardless of who will implement it.
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I searched open and closed issues and did not find the same technical proposal.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Technical area
      options:
        - Public API, CLI, configuration, schema, or diagnostics
        - Architecture or internal design
        - Refactor
        - Build or CI
        - Dependency
        - Release engineering
        - Other
    validations:
      required: true
  - type: textarea
    id: problem-constraints
    attributes:
      label: Problem and constraints
      description: State the current technical problem, supporting evidence, and constraints once.
    validations:
      required: true
  - type: textarea
    id: proposal-tradeoffs
    attributes:
      label: Proposal and tradeoffs
      description: Describe the proposed technical outcome and compare only viable alternatives that change the decision.
    validations:
      required: true
  - type: textarea
    id: boundaries-compatibility
    attributes:
      label: Boundaries and compatibility
      description: Identify affected contracts, necessary exclusions, migration concerns, and operational risks.
    validations:
      required: true
  - type: textarea
    id: acceptance-verification
    attributes:
      label: Acceptance and verification
      description: List observable completion conditions and how they will be verified.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add related code, specifications, or rollout details only when they are needed to evaluate the proposal.
