name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The offline repository gate that the pre-commit hook also runs: formatting
  # and lint for Rust, Markdown, JSON, YAML, shell, Nix, and workflows, the
  # workspace tests, and `docbridge validate` on this repository.
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: just verify
        run: nix develop -c just verify

  # The vNext Rust CLI on the five release platforms. Each host builds and
  # tests natively, then smoke-runs the release binary, which needs no
  # language runtime.
  rust-vnext:
    name: rust-vnext (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - name: Enable Windows symlink checkout
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the canonical skill symlink
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [[ ! -L .claude/skills ]]; then
            echo "::error::Windows checkout requires symlink creation privileges for .claude/skills; enable Developer Mode or grant Create symbolic links"
            exit 1
          fi
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Check agent assets on Windows
        if: runner.os == 'Windows'
        run: cargo run --quiet --locked -p xtask --target-dir .tmp/rust-vnext -- agent-gate
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --locked --target-dir .tmp/rust-vnext --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --target-dir .tmp/rust-vnext
      - name: Build release binary
        run: cargo build --package docbridge --release --locked --target ${{ matrix.target }} --target-dir .tmp/rust-vnext
      - name: Check static linkage
        if: runner.os == 'Linux'
        run: |
          bin=".tmp/rust-vnext/${{ matrix.target }}/release/docbridge"
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked|statically linked'
          ! ldd "$bin" 2>/dev/null | grep -q '=>'
      - name: Smoke-run the release binary
        shell: bash
        run: cargo run --quiet --locked -p xtask --target-dir .tmp/rust-vnext -- smoke .tmp/rust-vnext/${{ matrix.target }}/release/docbridge

  # Preserve the branch-protection check name while the expensive work runs in
  # parallel. This job succeeds only when all required workloads succeed.
  ci:
    name: ci
    if: always()
    needs: [quality, rust-vnext]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI workloads
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUST_VNEXT_RESULT: ${{ needs.rust-vnext.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$RUST_VNEXT_RESULT" = success
