name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Read the Swift version
        id: toolchains
        run: echo "swift=$(cat .swift-version)" >> "$GITHUB_OUTPUT"

      # Rust and Go come from the Nix shell, which reads rust-toolchain.toml
      # and pins nixpkgs; `just check-go-toolchain` rejects a Go that drifts
      # from the worker's go.mod.
      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: ${{ steps.toolchains.outputs.swift }}

      - name: Install dependencies
        run: |
          nix develop -c bun install --frozen-lockfile
          nix develop -c just install-editor-deps
          nix develop -c dart pub get --directory packages/dart-scanner --enforce-lockfile

      - name: just format-check
        run: nix develop -c just format-check

      - name: just lint
        run: nix develop -c just lint

      - name: just check
        run: nix develop -c just check

      - name: just check-ai-assets
        run: nix develop -c just check-ai-assets

      - name: just typecheck
        run: nix develop -c just typecheck

      # The editor client is a separate TypeScript project the root tsconfig
      # does not include, so this is the only gate that type-checks it.
      - name: just typecheck-extension
        run: nix develop -c just typecheck-extension

  test-dist:
    name: test-dist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # `.swift-version`, `rust-toolchain.toml`, and the Go worker's `go.mod`
      # are the only sources of the toolchain versions; the setup actions below
      # take them from here.
      - name: Read toolchain versions
        id: toolchains
        run: |
          echo "swift=$(cat .swift-version)" >> "$GITHUB_OUTPUT"
          echo "rust=$(sed -n 's/^channel = "\(.*\)"$/\1/p' packages/rust-scanner/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # nixpkgs only ships Swift 5.10 on Linux, which cannot build the scanner's
      # Swift 6 package, so the toolchain comes from setup-swift instead of nix.
      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: ${{ steps.toolchains.outputs.swift }}

      - name: Install Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.11.6"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchains.outputs.rust }}

      # `GOTOOLCHAIN=local` keeps setup-go and `go` itself from downloading a
      # different toolchain than the one go.mod pins.
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        env:
          GOTOOLCHAIN: local
        with:
          go-version-file: packages/go-scanner/go.mod
          # The worker has no dependencies, so there is no go.sum to key on.
          cache: false

      - name: Install dependencies
        run: nix develop -c bun install --frozen-lockfile

      # Cache the SwiftPM build directory and dependency clones so swift-syntax
      # (the dominant compile cost) is reused across runs. The cache key is
      # pinned to Package.resolved, which pins the swift-syntax revision, so the
      # cache stays valid until the dependency is bumped. The key also names the
      # Swift version, because another compiler cannot reuse these artifacts.
      # Debug artifacts only:
      # caching a release .build can corrupt incremental relinks
      # (swiftlang/swift-package-manager#8260), so the build below stays debug.
      - name: Cache the Swift scanner build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/swift-scanner/.build
            ~/.cache/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-swift${{ steps.toolchains.outputs.swift }}-${{ hashFiles('packages/swift-scanner/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-swift${{ steps.toolchains.outputs.swift }}-

      # The Swift integration test spawns the bundled Swift scanner binary, so
      # build it (with the setup-swift toolchain, not nix) before the suite.
      # A debug build is used, not release: CI only needs a functional binary
      # for the test, debug compiles swift-syntax far faster, and `swift test`
      # below reuses the same debug artifacts instead of recompiling.
      - name: Build the Swift scanner
        run: swift build --package-path packages/swift-scanner

      - name: Test the Swift scanner
        run: swift test --package-path packages/swift-scanner

      # Build with the official SDK outside Nix so the Linux scanner remains
      # runnable on hosts without a Nix store.
      - name: Build the Dart scanner
        run: |
          cd packages/dart-scanner
          dart pub get --enforce-lockfile
          dart compile exe bin/docbridge_dart_scanner.dart -o bin/docbridge_dart_scanner

      - name: Test the Dart scanner
        run: |
          cd packages/dart-scanner
          dart test

      - name: Build the Rust scanner
        run: cargo build --manifest-path packages/rust-scanner/Cargo.toml

      - name: Test the Rust scanner
        run: cargo test --manifest-path packages/rust-scanner/Cargo.toml

      # Built outside Nix like the Dart scanner with the setup-go toolchain.
      # The version check mirrors `just check-go-toolchain`; CGO_ENABLED=0
      # makes the binary static.
      - name: Build the Go scanner
        env:
          GOTOOLCHAIN: local
        run: |
          cd packages/go-scanner
          test "$(go env GOVERSION)" = "go$(sed -n 's/^go \(.*\)$/\1/p' go.mod)"
          CGO_ENABLED=0 go build -trimpath -o bin/docbridge-go-scanner ./cmd/docbridge-go-scanner

      - name: Test the Go scanner
        env:
          GOTOOLCHAIN: local
        run: |
          cd packages/go-scanner
          go test ./...

      # --- Python worker: setup, format, lint, and tests ---
      # The worker's runtime floor is CPython 3.10. setup-python provides that
      # interpreter for a floor run of the unittest suite; the nix shell's
      # CPython (the latest release) covers the same suite through `just`.
      - name: Install CPython 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Test the Python scanner on CPython 3.10
        run: python3 -m unittest discover -s packages/python-scanner/tests

      - name: just format-check-python
        run: nix develop -c just format-check-python

      - name: just lint-python
        run: nix develop -c just lint-python

      - name: just test-python-scanner
        run: nix develop -c just test-python-scanner
      # --- end Python worker ---

      # --- Ruby worker: setup and tests ---
      # The Nix shell covers CRuby 3.4 (Prism 1.x) through `just test` and
      # `just test-ruby-scanner`; this step covers the 3.3 floor, whose bundled
      # Prism 0.19 has a different node API. The suite runs the pending
      # fixtures through the executable, so no Bun is needed here. The step
      # runs outside Nix so the setup-ruby toolchain is the `ruby` on PATH.
      - name: Set up Ruby 3.3
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Test the Ruby scanner on Ruby 3.3
        run: |
          cd packages/ruby-scanner
          ruby --version
          ruby -w -Ilib -Itest test/run.rb

      - name: Test the Ruby scanner
        run: nix develop -c just test-ruby-scanner
      # --- end Ruby worker ---

      # --- Java worker: setup, build, lint, and tests ---
      # The JDK pinned by .java-version is installed outside Nix like the Dart
      # and Go toolchains; the recipes need only javac, jar, and java.
      - name: Set up the JDK for the Java scanner
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Build the Java scanner
        run: nix develop -c just build-java-scanner

      - name: Lint the Java scanner
        run: nix develop -c just lint-java

      - name: Test the Java scanner
        run: nix develop -c just test-java-scanner
      # --- end Java worker ---

      - name: just test
        run: nix develop -c just test

      - name: just build
        run: nix develop -c just build

      - name: Stage scanner binaries
        run: >-
          nix develop -c just stage-scanner-binaries
          --platform linux-x64
          --swift packages/swift-scanner/.build/debug/docbridge-swift-scanner
          --rust packages/rust-scanner/target/debug/docbridge-rust-scanner

      - name: just verify-dist
        run: nix develop -c just verify-dist

      - name: Pack and smoke-test npm package
        id: pack
        run: |
          tarball="$(npm pack)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          nix develop -c just pack-smoke "$tarball"

      # The release packs on Linux too, so Windows users install exactly this
      # kind of tarball; pack-smoke-windows installs this one.
      - name: Upload the npm tarball for the Windows smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  # Installs the tarball test-dist packed into a path with spaces and runs the
  # runtime-backed workers from it, read-only and writable, plus a missing
  # runtime. Native scanner binaries are not shipped for Windows, so only the
  # Python, Ruby, and Java workers are smoked. Informational until it has
  # passed once: it is deliberately left out of the required `ci` aggregate
  # below; add it to `ci.needs` after its first green run.
  pack-smoke-windows:
    name: pack-smoke-windows
    needs: test-dist
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the npm tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: tarball

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install CPython 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Set up Ruby 3.3
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Set up the JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .java-version

      # The smoke script resolves workers through the core's own module, which
      # needs the locked dev dependencies.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke-test the runtime-backed workers from the packed package
        shell: bash
        run: bun run scripts/smoke-packed-package.ts tarball/docbridge-*.tgz --runtime-workers-only

  # Preserve the branch-protection check name while the expensive work runs in
  # parallel. This job succeeds only when both required workloads succeed.
  ci:
    name: ci
    if: always()
    needs: [quality, test-dist]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI workloads
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_DIST_RESULT: ${{ needs.test-dist.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_DIST_RESULT" = success

  # Informational, never required for merge: runs `docbridge related --gate`
  # over the PR's whole change set and maintains one sticky comment so the
  # human approving the merge sees which linked counterparts were not updated.
  related-gate-report:
    name: related-gate-report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      # fetch-depth: 0 is required: the primary changed-file derivation is
      # `git diff BASE_SHA...HEAD_SHA`, which needs both commit objects. A
      # shallow checkout is the one configuration that breaks this recipe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install dependencies
        run: nix develop -c bun install --frozen-lockfile

      - name: Derive the PR changed-file list
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh_api_with_retry() {
            local attempt=1
            local delay=2
            local stderr_file
            local stdout_file
            stderr_file="$(mktemp)"
            stdout_file="$(mktemp)"
            while [ "$attempt" -le 3 ]; do
              if gh api "$@" >"$stdout_file" 2>"$stderr_file"; then
                cat "$stdout_file"
                rm -f "$stderr_file" "$stdout_file"
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                cat "$stderr_file" >&2
                rm -f "$stderr_file" "$stdout_file"
                return 1
              fi
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          record_infra_error() {
            local reason="$1"
            local delimiter
            delimiter="INFRA_REASON_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            {
              echo "GATE_OUTCOME=infra-error"
              echo "INFRA_REASON<<${delimiter}"
              printf '%s\n' "$reason"
              echo "${delimiter}"
            } >> "$GITHUB_ENV"
          }

          derived=0
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git_diff_err_file="$(mktemp)"
            if git diff --name-only "${BASE_SHA}...${HEAD_SHA}" \
              >changed-files.txt 2>"$git_diff_err_file"; then
              echo "CHANGED_FILES_SOURCE=git" >> "$GITHUB_ENV"
              echo "changed-file source: git"
              derived=1
            else
              printf 'git diff failed: %s\n' "$(cat "$git_diff_err_file")" >&2
            fi
            rm -f "$git_diff_err_file"
          fi

          if [ "$derived" -ne 1 ]; then
            rm -f changed-files.txt
            api_err_file="$(mktemp)"
            if gh_api_with_retry "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
              -q '.[].filename' >changed-files.txt 2>"$api_err_file"; then
              echo "CHANGED_FILES_SOURCE=api" >> "$GITHUB_ENV"
              echo "changed-file source: api"
              rm -f "$api_err_file"
            else
              api_err="$(cat "$api_err_file" 2>/dev/null || true)"
              rm -f "$api_err_file" changed-files.txt
              record_infra_error "changed-file list unobtainable (git derivation failed; gh api fallback failed): ${api_err:-no stderr}"
            fi
          fi

      - name: Run related-gate over the PR change set
        if: ${{ env.GATE_OUTCOME != 'infra-error' }}
        run: |
          gate_status=0
          nix develop -c bun run src/cli/index.ts related --stdin --gate --json \
            < changed-files.txt > gate-output.json 2> gate-stderr.txt || gate_status=$?

          # Exit 1 also covers configuration and invocation errors, so only a
          # well-formed gate report may classify the run as clean or violation.
          report_violations=""
          if jq -se '
              length == 1 and (.[0] | type == "object"
                and (.violations | type == "array")
                and all(.violations[]; type == "object"
                  and all(.changedEndpoint, .changedFilePath,
                    .counterpartEndpoint, .counterpartFilePath; type == "string"))
                and (.summary.changedFiles | type == "number" and . >= 0 and . == floor)
                and .summary.violations == (.violations | length))
            ' gate-output.json >/dev/null 2>&1; then
            report_violations="$(jq -r '.summary.violations' gate-output.json)"
          fi

          if [ "$gate_status" = "0" ] && [ "$report_violations" = "0" ]; then
            echo "GATE_OUTCOME=clean" >> "$GITHUB_ENV"
          elif [ "$gate_status" = "1" ] && [ -n "$report_violations" ] \
            && [ "$report_violations" != "0" ]; then
            jq -r '.violations[]
              | "\(.changedEndpoint) -> \(.counterpartEndpoint) (counterpart not in change set)"' \
              gate-output.json > gate-report.txt
            echo "GATE_OUTCOME=violation" >> "$GITHUB_ENV"
          else
            # A random delimiter, and a newline after each captured chunk, keep tool
            # output from closing or swallowing the multiline value.
            delimiter="INFRA_REASON_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            {
              echo "GATE_OUTCOME=infra-error"
              echo "INFRA_REASON<<${delimiter}"
              echo "docbridge related --gate exited ${gate_status} without a matching gate report"
              printf '%s\n' "$(tail -n 40 gate-stderr.txt)"
              printf '%s\n' "$(tail -n 40 gate-output.json)"
              echo "${delimiter}"
            } >> "$GITHUB_ENV"
          fi
          cat gate-output.json
          cat gate-stderr.txt >&2

      - name: Create or update the sticky PR comment
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh_api_with_retry() {
            local attempt=1
            local delay=2
            local stderr_file
            local stdout_file
            stderr_file="$(mktemp)"
            stdout_file="$(mktemp)"
            while [ "$attempt" -le 3 ]; do
              if gh api "$@" >"$stdout_file" 2>"$stderr_file"; then
                cat "$stdout_file"
                rm -f "$stderr_file" "$stdout_file"
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                cat "$stderr_file" >&2
                rm -f "$stderr_file" "$stdout_file"
                return 1
              fi
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          outcome="${GATE_OUTCOME:-infra-error}"
          reason="${INFRA_REASON:-GATE_OUTCOME was unset; prior step likely aborted before recording an outcome}"

          marker='<!-- docbridge-related-gate -->'
          {
            echo "$marker"
            echo "## DocBridge related-gate"
            echo
            if [ "$outcome" = "clean" ]; then
              echo "All linked counterparts of the changed files are part of this PR's change set."
            elif [ "$outcome" = "violation" ]; then
              echo "Changed files have linked counterparts that this PR does not update."
              echo "For each entry, either update the counterpart or make sure the PR explains why no update is needed."
              echo
              echo '```'
              cat gate-report.txt
              echo '```'
            else
              echo "DocBridge related-gate could not run — infrastructure failure."
              echo
              echo "Reason:"
              echo '```'
              printf '%s\n' "$reason"
              echo '```'
            fi
          } > comment.md

          {
            echo "## DocBridge related-gate"
            echo
            echo "Outcome: \`${outcome}\`"
            if [ -n "${CHANGED_FILES_SOURCE:-}" ]; then
              echo "Source: \`${CHANGED_FILES_SOURCE}\`"
            fi
            if [ "$outcome" = "infra-error" ]; then
              echo
              echo "Reason:"
              echo '```'
              printf '%s\n' "$reason"
              echo '```'
            elif [ "$outcome" = "clean" ]; then
              echo
              echo "All linked counterparts of the changed files are part of this PR's change set."
            else
              echo
              echo "Changed files have linked counterparts that this PR does not update."
              echo
              echo '```'
              cat gate-report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          comment_id="$(gh_api_with_retry "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            -q ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh_api_with_retry -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@comment.md
          else
            gh_api_with_retry -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@comment.md
          fi

          if [ "$outcome" = "infra-error" ]; then
            exit 1
          fi
