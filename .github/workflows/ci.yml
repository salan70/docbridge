name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The offline repository gate that the pre-commit hook also runs: formatting
  # and lint for Rust, Markdown, JSON, YAML, shell, Nix, and workflows, the
  # workspace tests, and `docbridge validate` on this repository.
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: just verify
        run: nix develop -c just verify

  # The vNext Rust CLI on the five release platforms. Each host builds and
  # tests natively, then smoke-runs the release binary, which needs no
  # language runtime.
  rust-vnext:
    name: rust-vnext (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      # Linux releases are static musl binaries; ring's C code needs musl-gcc.
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --locked --target-dir .tmp/rust-vnext --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --target-dir .tmp/rust-vnext
      - name: Build release binary
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            target="${{ matrix.target }}"
            export "CC_${target//-/_}=musl-gcc"
            target_env="$(tr '[:lower:]-' '[:upper:]_' <<<"$target")"
            export "CARGO_TARGET_${target_env}_LINKER=musl-gcc"
          fi
          cargo build --package docbridge --release --locked --target ${{ matrix.target }} --target-dir .tmp/rust-vnext
      - name: Check static linkage
        if: runner.os == 'Linux'
        run: |
          bin=".tmp/rust-vnext/${{ matrix.target }}/release/docbridge"
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked|statically linked'
          ! ldd "$bin" 2>/dev/null | grep -q '=>'
      - name: Smoke-run the release binary
        shell: bash
        run: scripts/smoke-vnext.sh .tmp/rust-vnext/${{ matrix.target }}/release/docbridge
      # Stage the binary under its release asset name for the signing dry run.
      - name: Stage the release asset
        shell: bash
        run: |
          ext=""
          if [[ "$RUNNER_OS" == Windows ]]; then ext=".exe"; fi
          mkdir -p .tmp/release-asset
          cp ".tmp/rust-vnext/${{ matrix.target }}/release/docbridge${ext}" ".tmp/release-asset/docbridge-${{ matrix.target }}${ext}"
      - name: Upload the release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docbridge-${{ matrix.target }}
          path: .tmp/release-asset/
          if-no-files-found: error
          retention-days: 7

  # Signs the five binaries from rust-vnext with a throwaway key generated in the
  # job and verifies the complete asset set through the upgrade verifier. No
  # release is created and no production key is used.
  release-dry-run:
    name: release-dry-run
    needs: rust-vnext
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docbridge-*
          path: .tmp/release-artifacts
          merge-multiple: true
      - name: Build the release tool
        run: cargo build --package docbridge-release --locked --target-dir .tmp/rust-vnext
      - name: Sign and verify with a throwaway key
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/docbridge/Cargo.toml | head -n 1)"
          scripts/release-vnext-dry-run.sh .tmp/rust-vnext/debug/docbridge-release \
            .tmp/release-artifacts .tmp/release-signed "$version"

  # Preserve the branch-protection check name while the expensive work runs in
  # parallel. This job succeeds only when all required workloads succeed.
  ci:
    name: ci
    if: always()
    needs: [quality, rust-vnext, release-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI workloads
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUST_VNEXT_RESULT: ${{ needs.rust-vnext.result }}
          RELEASE_DRY_RUN_RESULT: ${{ needs.release-dry-run.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$RUST_VNEXT_RESULT" = success
          test "$RELEASE_DRY_RUN_RESULT" = success
