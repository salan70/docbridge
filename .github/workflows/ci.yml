name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The offline repository gate, `just verify`: formatting and lint checks, the
  # workspace tests on Linux x64, and `docbridge validate` on this repository.
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: just verify
        run: nix develop -c just verify

  # Clippy, the workspace tests, a release build, and a smoke run on each of the
  # five release targets.
  native:
    name: native
    uses: ./.github/workflows/native.yml
    with:
      check: true

  # Preserve the branch-protection check name while the expensive work runs in
  # parallel. This job succeeds only when all required workloads succeed.
  ci:
    name: ci
    if: always()
    needs: [quality, native]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI workloads
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$NATIVE_RESULT" = success
