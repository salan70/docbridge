name: Release vNext

# Manual release of the vNext Rust CLI during the cutover. It never runs on its
# own: a maintainer dispatches it. The legacy npm release stays in
# release-publish.yml and is unaffected.
#
# dry-run (default): builds the five targets, signs them with a throwaway key
#   generated in the job, and verifies the complete asset set. Creates nothing.
# release: requires main, a retired legacy publisher (no other workflow
#   publishes releases or npm packages), a version equal to
#   crates/docbridge/Cargo.toml, no release for it, a `v<version>` tag that is
#   absent or already at this commit, and in the `release` environment the
#   DOCBRIDGE_RELEASE_KEY_ID and DOCBRIDGE_RELEASE_KEY_SECRET variables naming the
#   active key and its per-key secret. It signs once, verifies against the keys
#   compiled into this commit, uploads everything to a DRAFT release, re-downloads
#   and verifies the draft's complete asset set, creates the tag at this commit,
#   and only then publishes it. Any failure leaves at most a draft and a tag at
#   this commit.
#
# See docs/contributing/releasing.md#vnext-release-manual.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run signs with a throwaway key and creates nothing; release publishes
        type: choice
        options: [dry-run, release]
        default: dry-run
      version:
        description: Release version X.Y.Z (release mode only; must equal crates/docbridge/Cargo.toml)
        required: false
        default: ""

concurrency:
  group: release-vnext
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve and check the version
        id: version
        env:
          MODE: ${{ inputs.mode }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/docbridge/Cargo.toml | head -n 1)"
          if [ "$MODE" = release ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::release mode runs only from main"
              exit 1
            fi
            if ! [[ "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::version must be X.Y.Z without a leading v, prerelease, or build metadata"
              exit 1
            fi
            if [ "$INPUT_VERSION" != "$crate" ]; then
              echo "::error::crates/docbridge/Cargo.toml has version $crate, not $INPUT_VERSION"
              exit 1
            fi
            scripts/check-legacy-publisher-retired.sh .github/workflows
            version="$INPUT_VERSION"
          else
            version="$crate"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # The tag must be absent or already at this commit; a failed lookup fails.
      - name: Check the release tag
        if: inputs.mode == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-vnext-tag.sh check "$VERSION" "$GITHUB_SHA"

  build:
    name: build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0
          targets: ${{ matrix.target }}
      # Linux releases are static musl binaries; ring's C code needs musl-gcc.
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build release binary
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            target="${{ matrix.target }}"
            export "CC_${target//-/_}=musl-gcc"
            target_env="$(tr '[:lower:]-' '[:upper:]_' <<<"$target")"
            export "CARGO_TARGET_${target_env}_LINKER=musl-gcc"
          fi
          cargo build --package docbridge --release --locked --target ${{ matrix.target }} --target-dir .tmp/rust-vnext
      - name: Check static linkage
        if: runner.os == 'Linux'
        run: |
          bin=".tmp/rust-vnext/${{ matrix.target }}/release/docbridge"
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked|statically linked'
          ! ldd "$bin" 2>/dev/null | grep -q '=>'
      - name: Smoke-run the release binary
        shell: bash
        run: scripts/smoke-vnext.sh .tmp/rust-vnext/${{ matrix.target }}/release/docbridge
      - name: Stage the release asset
        shell: bash
        run: |
          ext=""
          if [[ "$RUNNER_OS" == Windows ]]; then ext=".exe"; fi
          mkdir -p .tmp/release-asset
          cp ".tmp/rust-vnext/${{ matrix.target }}/release/docbridge${ext}" ".tmp/release-asset/docbridge-${{ matrix.target }}${ext}"
      - name: Upload the release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docbridge-${{ matrix.target }}
          path: .tmp/release-asset/
          if-no-files-found: error
          retention-days: 7

  sign-dry-run:
    name: sign (dry run, throwaway key)
    if: inputs.mode != 'release'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docbridge-*
          path: .tmp/release-artifacts
          merge-multiple: true
      - name: Build the release tool
        run: cargo build --package docbridge-release --locked --target-dir .tmp/rust-vnext
      - name: Sign and verify with a throwaway key
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          scripts/release-vnext-dry-run.sh .tmp/rust-vnext/debug/docbridge-release \
            .tmp/release-artifacts .tmp/release-signed "$VERSION"

  sign:
    name: sign (release key)
    if: inputs.mode == 'release'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docbridge-*
          path: .tmp/release-artifacts
          merge-multiple: true
      - name: Build the release tool
        run: cargo build --package docbridge-release --release --locked --target-dir .tmp/rust-vnext
      # Fails closed: a missing key ID, secret name, or secret, or a secret name
      # that does not belong to the key ID, stops the release before signing. Each
      # key has its own secret (scripts/release-keygen.sh), so staging a new key
      # never replaces the active one.
      - name: Sign the asset set
        env:
          DOCBRIDGE_RELEASE_SIGNING_KEY: ${{ secrets[vars.DOCBRIDGE_RELEASE_KEY_SECRET] }}
          KEY_ID: ${{ vars.DOCBRIDGE_RELEASE_KEY_ID }}
          KEY_SECRET: ${{ vars.DOCBRIDGE_RELEASE_KEY_SECRET }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$KEY_SECRET" ]; then
            echo "::error::DOCBRIDGE_RELEASE_KEY_ID and DOCBRIDGE_RELEASE_KEY_SECRET must be set in the release environment"
            exit 1
          fi
          expected="DOCBRIDGE_RELEASE_SIGNING_KEY_$(printf '%s' "$KEY_ID" | tr 'a-z.-' 'A-Z__')"
          if [ "$KEY_SECRET" != "$expected" ]; then
            echo "::error::DOCBRIDGE_RELEASE_KEY_SECRET is ${KEY_SECRET}, not ${expected}; run scripts/release-keygen.sh --activate again"
            exit 1
          fi
          if [ -z "$DOCBRIDGE_RELEASE_SIGNING_KEY" ]; then
            echo "::error::secret ${KEY_SECRET} is not set in the release environment"
            exit 1
          fi
          # The released CLI must trust a primary and an offline backup key, and
          # the signing key must be one of them.
          trusted="$(.tmp/rust-vnext/release/docbridge-release trusted-keys)"
          if [ "$(wc -l <<<"${trusted}" | tr -d ' ')" -lt 2 ] || [ -z "${trusted}" ]; then
            echo "::error::crates/docbridge-update/keys/trusted-keys.txt needs a primary and a backup key"
            exit 1
          fi
          if ! grep -qxF "$KEY_ID" <<<"$trusted"; then
            echo "::error::DOCBRIDGE_RELEASE_KEY_ID is not a compiled trusted key"
            exit 1
          fi
          .tmp/rust-vnext/release/docbridge-release sign --version "$VERSION" \
            --artifacts .tmp/release-artifacts --out .tmp/release-signed \
            --key-id "$KEY_ID" --key-env DOCBRIDGE_RELEASE_SIGNING_KEY
      # The released binaries trust exactly the keys compiled into this commit, so
      # the set must verify with them; while production trust is pending, it fails.
      - name: Verify against the compiled trusted keys
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: .tmp/rust-vnext/release/docbridge-release verify --dir .tmp/release-signed --version "$VERSION" --compiled-keys
      - name: Upload the signed asset set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: .tmp/release-signed/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish (draft, verify, un-draft)
    if: inputs.mode == 'release'
    needs: [prepare, sign]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0
      - name: Build the release tool
        run: cargo build --package docbridge-release --release --locked --target-dir .tmp/rust-vnext
      - name: Download the signed asset set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: .tmp/release-signed
      - name: Refuse an existing release or draft, or a tag elsewhere
        run: |
          scripts/release-vnext-tag.sh check "$VERSION" "$GITHUB_SHA"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"v${VERSION}\") | .id")"
          if [ -n "$existing" ]; then
            echo "::error::a release or draft for v${VERSION} already exists (ids: ${existing//$'\n'/ }); delete it first"
            exit 1
          fi
      - name: Create the draft release with every asset
        id: draft
        run: |
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "v${VERSION}" \
            --notes "DocBridge v${VERSION}. Verify downloads with docbridge-manifest.json and docbridge-manifest.sig." \
            .tmp/release-signed/*
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"v${VERSION}\") | .id")"
          if [ "$(wc -w <<<"$id")" -ne 1 ]; then
            echo "::error::expected exactly one draft for v${VERSION}, found: ${id}"
            exit 1
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"
      - name: Re-download the draft's assets
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          mkdir .tmp/release-redownload
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
            --jq '.[] | select(.state == "uploaded") | "\(.id) \(.name)"' >.tmp/release-assets.txt
          cat .tmp/release-assets.txt
          while read -r asset_id name; do
            case "$name" in
              */* | .* | "") echo "::error::unexpected asset name ${name}"; exit 1 ;;
            esac
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >".tmp/release-redownload/${name}"
          done <.tmp/release-assets.txt
      # Exact asset set, SHA256SUMS, and every target through the upgrade verifier
      # with the compiled trusted keys.
      - name: Verify the complete draft asset set
        run: .tmp/rust-vnext/release/docbridge-release verify --dir .tmp/release-redownload --version "$VERSION" --compiled-keys
      # GitHub publishes a draft on an existing tag and ignores its target commit,
      # so the tag is created here at this commit, or must already point at it.
      # Annotated tags and lookup failures fail closed.
      - name: Publish the verified draft at this commit
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          scripts/release-vnext-tag.sh ensure "$VERSION" "$GITHUB_SHA"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest=true >/dev/null
          scripts/release-vnext-tag.sh check "$VERSION" "$GITHUB_SHA"
          echo "Published v${VERSION}"
