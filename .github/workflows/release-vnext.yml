name: Release vNext

# Manual release of the DocBridge CLI. What it checks and publishes, and how to
# recover from a failure: docs/contributing/releasing.md#vnext-release-manual.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version X.Y.Z (must equal the workspace version in Cargo.toml)
        required: true

concurrency:
  group: release-vnext
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The documented `gh attestation verify --source-ref refs/heads/main`
      # holds only because every release is built from main.
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::releases run only from main, not ${GITHUB_REF}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0
      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          crate="$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.name == "docbridge") | .version')"
          if ! [[ "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be X.Y.Z without a leading v, prerelease, or build metadata"
            exit 1
          fi
          if [ "$INPUT_VERSION" != "$crate" ]; then
            echo "::error::the docbridge package has version $crate, not $INPUT_VERSION"
            exit 1
          fi
          echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/native.yml
    with:
      upload: true

  publish:
    name: publish (draft, verify, un-draft)
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      EXECUTABLES: >-
        docbridge-aarch64-apple-darwin
        docbridge-aarch64-unknown-linux-musl
        docbridge-x86_64-apple-darwin
        docbridge-x86_64-pc-windows-msvc.exe
        docbridge-x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag must be absent or a lightweight tag at exactly this commit; a
      # tag elsewhere, an annotated tag, or a failed lookup fails. No release or
      # draft for the tag may exist yet.
      - name: Refuse an existing release or draft, or a tag elsewhere
        run: |
          status=0
          refs="$(git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}")" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error::looking up tag v${VERSION} on origin failed (git exit ${status})"
            exit 1
          fi
          if [ "$status" -eq 0 ] && [ "$refs" != "${GITHUB_SHA}"$'\t'"refs/tags/v${VERSION}" ]; then
            echo "::error::tag v${VERSION} exists and does not point at ${GITHUB_SHA}: ${refs}"
            exit 1
          fi
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"v${VERSION}\") | .id")"
          if [ -n "$existing" ]; then
            echo "::error::a release or draft for v${VERSION} already exists (ids: ${existing//$'\n'/ }); delete it first"
            exit 1
          fi
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docbridge-*
          path: .tmp/release-assets
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: .tmp/release-assets
        run: |
          read -ra executables <<<"$EXECUTABLES"
          found=(*)
          if [ "$(printf '%s\n' "${found[@]}" | LC_ALL=C sort)" != "$(printf '%s\n' "${executables[@]}" | LC_ALL=C sort)" ]; then
            echo "::error::expected exactly ${EXECUTABLES}, found: ${found[*]}"
            exit 1
          fi
          sha256sum "${executables[@]}" >SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .tmp/release-assets/docbridge-*
      - name: Create the draft release with every asset
        id: draft
        run: |
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "v${VERSION}" \
            --notes "DocBridge v${VERSION}. Verify downloads with gh attestation verify and SHA256SUMS: https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/README.md#install" \
            .tmp/release-assets/*
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"v${VERSION}\") | .id")"
          if [ "$(wc -w <<<"$id")" -ne 1 ]; then
            echo "::error::expected exactly one draft for v${VERSION}, found: ${id}"
            exit 1
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"
      - name: Re-download the draft's assets
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          mkdir .tmp/release-redownload
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
            --jq '.[] | select(.state == "uploaded") | "\(.id) \(.name)"' >.tmp/release-asset-list.txt
          cat .tmp/release-asset-list.txt
          while read -r asset_id name; do
            case "$name" in
              */* | .* | "") echo "::error::unexpected asset name ${name}"; exit 1 ;;
            esac
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >".tmp/release-redownload/${name}"
          done <.tmp/release-asset-list.txt
      - name: Verify the draft's assets
        working-directory: .tmp/release-redownload
        run: |
          read -ra expected <<<"SHA256SUMS $EXECUTABLES"
          found=(*)
          if [ "$(printf '%s\n' "${found[@]}" | LC_ALL=C sort)" != "$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)" ]; then
            echo "::error::expected exactly SHA256SUMS ${EXECUTABLES}, found: ${found[*]}"
            exit 1
          fi
          sha256sum -c SHA256SUMS
      # GitHub publishes a draft on an existing tag and ignores its target commit,
      # so the tag is created here at this commit, or must already point at it.
      # Annotated tags and lookup failures fail closed.
      - name: Publish the verified draft at this commit
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          tag_at() {
            local refs status=0
            refs="$(git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}")" || status=$?
            if [ "$status" -eq 2 ]; then
              return 0
            fi
            if [ "$status" -ne 0 ]; then
              echo "::error::looking up tag v${VERSION} on origin failed (git exit ${status})" >&2
              return 1
            fi
            if [ "$refs" != "${refs%%$'\n'*}" ]; then
              echo "::error::tag v${VERSION} is annotated or ambiguous: ${refs}" >&2
              return 1
            fi
            printf '%s\n' "${refs%%$'\t'*}"
          }
          current="$(tag_at)"
          if [ -z "$current" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/v${VERSION}" -f "sha=${GITHUB_SHA}" >/dev/null
            current="$(tag_at)"
          fi
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::tag v${VERSION} points at ${current:-nothing}, not ${GITHUB_SHA}"
            exit 1
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest=true >/dev/null
          if [ "$(tag_at)" != "$GITHUB_SHA" ]; then
            echo "::error::tag v${VERSION} moved away from ${GITHUB_SHA} while publishing"
            exit 1
          fi
          echo "Published v${VERSION}"
