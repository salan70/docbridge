[package]
name = "parser-gate"
version = "0.0.0"
edition = "2021"
publish = false
description = "DocBridge Phase 0 parser gate candidate (issue #200); never shipped"

[[bin]]
name = "parser-gate"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "=0.25.10"
tree-sitter-dart = "=0.2.0"
tree-sitter-swift = "=0.7.4"
